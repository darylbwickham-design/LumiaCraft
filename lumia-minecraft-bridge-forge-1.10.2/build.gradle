buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.2-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '0.3.0'
group = 'me.lumiabridge'
archivesBaseName = 'lumiabridge-forge-1.10.2'

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.10.2-12.18.3.2511'
    runDir = 'run'
    mappings = 'stable_29'
    makeObfSourceJar = false
}

sourceSets {
    main {
        java {
            srcDir '../lumia-minecraft-bridge-legacy-common/src/main/java'
            srcDir '../lumia-minecraft-bridge-forge-legacy-modern/src/main/java'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.10.2'
    }
    from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
