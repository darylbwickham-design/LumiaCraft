buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:4.1.+' }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = mod_version
group = mod_group_id
archivesBaseName = "${mod_id}-forge-${minecraft_version}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories { mavenCentral() }

dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }

jar {
    manifest { attributes([
        'Specification-Title': mod_id,
        'Specification-Vendor': 'Lumia Community',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': "${version}",
        'Implementation-Vendor': 'Lumia Community'
    ]) }
}

reobf { jar {} }
jar.finalizedBy('reobfJar')

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version, 'minecraft_version': minecraft_version, 'forge_version': forge_version,
                'mod_id': mod_id, 'mod_name': mod_name
    }
}
